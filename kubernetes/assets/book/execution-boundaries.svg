<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">프로그램은 어디에서 실행되고 무엇을 공유할까?</title><desc id="desc">직접 실행은 OS 환경을 공유한다. VM마다 guest kernel이 있으며 일반 Linux 컨테이너는 실행 호스트의 kernel을 공유한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52647b"/></marker></defs><rect width="1400" height="820" fill="#f7f9fc"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="60" y="64" text-anchor="start" font-size="34" font-weight="700" fill="#192c43">프로그램은 어디에서 실행되고 무엇을 공유할까?</text>
<text x="60" y="106" text-anchor="start" font-size="20" font-weight="400" fill="#52647b">일반적인 Linux 실행 모델의 비교 · VM과 컨테이너는 함께 사용할 수 있다.</text>
<rect x="50" y="150" width="390" height="540" rx="20" fill="white" stroke="#d6dfea" stroke-width="2"/>
<text x="74" y="190" text-anchor="start" font-size="25" font-weight="700" fill="#192c43">서버에 직접 실행</text>
<rect x="505" y="150" width="390" height="540" rx="20" fill="white" stroke="#d6dfea" stroke-width="2"/>
<text x="529" y="190" text-anchor="start" font-size="25" font-weight="700" fill="#192c43">가상 머신으로 분리</text>
<rect x="960" y="150" width="390" height="540" rx="20" fill="white" stroke="#d6dfea" stroke-width="2"/>
<text x="984" y="190" text-anchor="start" font-size="25" font-weight="700" fill="#192c43">컨테이너로 분리</text>
<rect x="75" y="250" width="340" height="110" rx="12" fill="#2457a7"/>
<text x="245.0" y="284" text-anchor="middle" font-size="23" font-weight="700" fill="white">앱 A · 앱 B</text>
<text x="245.0" y="317" text-anchor="middle" font-size="18" font-weight="400" fill="white">서버에 설치한 실행 환경</text>
<rect x="75" y="410" width="340" height="100" rx="12" fill="#2457a7"/>
<text x="245.0" y="444" text-anchor="middle" font-size="23" font-weight="700" fill="white">하나의 OS와 kernel</text>
<text x="245.0" y="477" text-anchor="middle" font-size="18" font-weight="400" fill="white">프로세스마다 자원 사용</text>
<rect x="75" y="565" width="340" height="70" rx="12" fill="#52647b"/>
<text x="245.0" y="599" text-anchor="middle" font-size="23" font-weight="700" fill="white">물리 또는 가상 서버</text>
<rect x="525" y="235" width="165" height="75" rx="12" fill="#2457a7"/>
<text x="607.5" y="269" text-anchor="middle" font-size="23" font-weight="700" fill="white">VM A의 앱</text>
<rect x="525" y="330" width="165" height="100" rx="12" fill="#21745b"/>
<text x="607.5" y="364" text-anchor="middle" font-size="23" font-weight="700" fill="white">Guest OS</text>
<text x="607.5" y="397" text-anchor="middle" font-size="18" font-weight="400" fill="white">각자의 kernel</text>
<rect x="710" y="235" width="165" height="75" rx="12" fill="#2457a7"/>
<text x="792.5" y="269" text-anchor="middle" font-size="23" font-weight="700" fill="white">VM B의 앱</text>
<rect x="710" y="330" width="165" height="100" rx="12" fill="#21745b"/>
<text x="792.5" y="364" text-anchor="middle" font-size="23" font-weight="700" fill="white">Guest OS</text>
<text x="792.5" y="397" text-anchor="middle" font-size="18" font-weight="400" fill="white">각자의 kernel</text>
<rect x="530" y="470" width="340" height="70" rx="12" fill="#a65b18"/>
<text x="700.0" y="504" text-anchor="middle" font-size="23" font-weight="700" fill="white">Hypervisor</text>
<rect x="530" y="565" width="340" height="70" rx="12" fill="#52647b"/>
<text x="700.0" y="599" text-anchor="middle" font-size="23" font-weight="700" fill="white">물리 서버</text>
<rect x="980" y="235" width="165" height="130" rx="12" fill="#2457a7"/>
<text x="1062.5" y="269" text-anchor="middle" font-size="23" font-weight="700" fill="white">컨테이너 A</text>
<text x="1062.5" y="302" text-anchor="middle" font-size="18" font-weight="400" fill="white">앱 프로세스</text>
<text x="1062.5" y="329" text-anchor="middle" font-size="18" font-weight="400" fill="white">실행 파일 환경</text>
<rect x="1165" y="235" width="165" height="130" rx="12" fill="#2457a7"/>
<text x="1247.5" y="269" text-anchor="middle" font-size="23" font-weight="700" fill="white">컨테이너 B</text>
<text x="1247.5" y="302" text-anchor="middle" font-size="18" font-weight="400" fill="white">앱 프로세스</text>
<text x="1247.5" y="329" text-anchor="middle" font-size="18" font-weight="400" fill="white">실행 파일 환경</text>
<rect x="985" y="410" width="340" height="100" rx="12" fill="#21745b"/>
<text x="1155.0" y="444" text-anchor="middle" font-size="23" font-weight="700" fill="white">공유 Linux kernel</text>
<text x="1155.0" y="477" text-anchor="middle" font-size="18" font-weight="400" fill="white">격리·자원 제약 적용</text>
<rect x="985" y="565" width="340" height="70" rx="12" fill="#52647b"/>
<text x="1155.0" y="599" text-anchor="middle" font-size="23" font-weight="700" fill="white">물리 서버 또는 VM</text>
<text x="60" y="762" text-anchor="start" font-size="20" font-weight="400" fill="#52647b">Docker Desktop에서 Linux 컨테이너를 실행하면 Linux VM 안의 kernel을 사용한다.</text>
</g></svg>