<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">이미지를 만드는 일과 컨테이너를 실행하는 일</title><desc id="desc">빌드 머신이 이미지를 만들고 레지스트리에 push한다. 실행 머신이 pull하고 runtime이 컨테이너 프로세스를 실행한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#52647b"/></marker></defs><rect width="1400" height="820" fill="#f7f9fc"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="60" y="64" text-anchor="start" font-size="34" font-weight="700" fill="#192c43">이미지를 만드는 일과 컨테이너를 실행하는 일</text>
<text x="60" y="106" text-anchor="start" font-size="20" font-weight="400" fill="#52647b">소스와 의존성을 패키징하고, 실행할 머신까지 전달한다.</text>
<rect x="50" y="170" width="360" height="490" rx="20" fill="white" stroke="#d6dfea" stroke-width="2"/>
<text x="74" y="210" text-anchor="start" font-size="25" font-weight="700" fill="#192c43">빌드 머신</text>
<rect x="470" y="170" width="360" height="490" rx="20" fill="white" stroke="#d6dfea" stroke-width="2"/>
<text x="494" y="210" text-anchor="start" font-size="25" font-weight="700" fill="#192c43">이미지 레지스트리</text>
<rect x="890" y="170" width="460" height="490" rx="20" fill="white" stroke="#d6dfea" stroke-width="2"/>
<text x="914" y="210" text-anchor="start" font-size="25" font-weight="700" fill="#192c43">실행 머신</text>
<rect x="80" y="250" width="300" height="100" rx="12" fill="#2457a7"/>
<text x="230.0" y="284" text-anchor="middle" font-size="23" font-weight="700" fill="white">소스 · 의존성</text>
<text x="230.0" y="317" text-anchor="middle" font-size="18" font-weight="400" fill="white">Dockerfile과 빌드 입력</text>
<path d="M230,350 L230,430" fill="none" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/>
<text x="238.0" y="378.0" text-anchor="middle" font-size="17" font-weight="400" fill="#52647b">build</text>
<rect x="80" y="435" width="300" height="110" rx="12" fill="#21745b"/>
<text x="230.0" y="469" text-anchor="middle" font-size="23" font-weight="700" fill="white">이미지</text>
<text x="230.0" y="502" text-anchor="middle" font-size="18" font-weight="400" fill="white">실행할 파일 + 실행 설정</text>
<rect x="500" y="365" width="300" height="150" rx="12" fill="#a65b18"/>
<text x="650.0" y="399" text-anchor="middle" font-size="23" font-weight="700" fill="white">이미지 보관</text>
<text x="650.0" y="432" text-anchor="middle" font-size="18" font-weight="400" fill="white">태그 · Digest</text>
<text x="650.0" y="459" text-anchor="middle" font-size="18" font-weight="400" fill="white">프로세스를 실행하지 않음</text>
<path d="M380,490 L500,490" fill="none" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/>
<text x="448.0" y="478.0" text-anchor="middle" font-size="17" font-weight="400" fill="#52647b">push</text>
<path d="M800,430 L870,430 L870,295 L915,295" fill="none" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/>
<text x="850" y="395" text-anchor="middle" font-size="17" font-weight="400" fill="#52647b">pull</text>
<rect x="920" y="245" width="400" height="100" rx="12" fill="#2457a7"/>
<text x="1120.0" y="279" text-anchor="middle" font-size="23" font-weight="700" fill="white">이미지 + 실행 시 설정</text>
<text x="1120.0" y="312" text-anchor="middle" font-size="18" font-weight="400" fill="white">환경변수 · mount · 네트워크</text>
<path d="M1120,345 L1120,420" fill="none" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/>
<text x="1128.0" y="370.5" text-anchor="middle" font-size="17" font-weight="400" fill="#52647b">runtime</text>
<rect x="920" y="430" width="400" height="130" rx="12" fill="#21745b"/>
<text x="1120.0" y="464" text-anchor="middle" font-size="23" font-weight="700" fill="white">실행 중인 컨테이너</text>
<text x="1120.0" y="497" text-anchor="middle" font-size="18" font-weight="400" fill="white">프로세스 + 쓰기 가능한 상태</text>
<text x="60" y="762" text-anchor="start" font-size="20" font-weight="400" fill="#52647b">같은 이미지여도 실행 시 설정·외부 서비스·호스트 조건까지 같다는 뜻은 아니다.</text>
</g></svg>